<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Industrial steel · conceptual load path</title><desc id="desc">Idealized braced frame with an 80 kN horizontal force at height 6 m. A 4 m vertical reaction couple balances 480 kN m. No member or foundation sizing.</desc>
