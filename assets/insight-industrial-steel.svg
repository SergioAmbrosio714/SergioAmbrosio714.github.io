<path d="M48 75H952M48 545H952" stroke="#c7d4d8" stroke-width="1" fill="none" />
<text x="48" y="46" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#245563" letter-spacing="1.6">LOAD PATH / TRAYECTORIA DE CARGAS</text><g fill="#c4cdcb" stroke="#9badaa"><rect x="227" y="444" width="88" height="29"/><rect x="684" y="444" width="88" height="29"/><rect x="247" y="423" width="47" height="21"/><rect x="705" y="423" width="47" height="21"/></g><g fill="#355b6b"><rect x="260" y="155" width="19" height="268"/><rect x="718" y="155" width="19" height="268"/><rect x="260" y="146" width="477" height="19"/></g><path d="M275 418L720 164M720 418L275 164" stroke="#688793" stroke-width="6" fill="none" /><path d="M268 168V415M726 168V415" stroke="#a4b8c0" stroke-width="2" fill="none" /><path d="M760 155H898" stroke="#245563" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="793" y="130" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#245563" >F = 80 kN</text><path d="M208 155H188V423H208M179 155H197M179 423H197" stroke="#bac9cf" stroke-width="1.5" fill="none" /><text x="95" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#253d48" >h = 6 m</text><path d="M270 491H728M270 482V500M728 482V500" stroke="#bac9cf" stroke-width="1.5" fill="none" /><text x="499" y="521" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#253d48" text-anchor="middle">B = 4 m</text><path d="M220 395V465" stroke="#245563" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M671 465V395" stroke="#245563" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="67" y="414" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#245563" >−120 kN</text><text x="755" y="391" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#245563" >+120 kN</text><text x="397" y="128" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#253d48" >M = 480 kN·m</text><text x="48" y="579" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5c747e" letter-spacing=".6">EQUILIBRIUM ONLY / EQUILIBRIO CONCEPTUAL</text>
