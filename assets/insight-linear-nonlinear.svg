<title id="title">Linear and nonlinear · analytical comparison</title><desc id="desc">Two educational force-displacement laws. Initial stiffness 10 kN/mm; bilinear yield 100 kN and post-yield slope 1 kN/mm. At 120 kN the displacements are 12 and 30 mm.</desc>
