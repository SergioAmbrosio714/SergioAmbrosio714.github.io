<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Story drift · conceptual displacement compatibility</title><desc id="desc">Compatible floor displacements 14 mm and 32 mm across a 3 m story give a drift ratio of 0.006. Deformations are amplified for clarity; no code limit is shown.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245563"/></marker></defs>
<rect width="1000" height="600" fill="#eef2f2"/>
<path d="M48 75H952M48 545H952" stroke="#c7d4d8" stroke-width="1" fill="none" />
<text x="48" y="46" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#245563" letter-spacing="1.6">STORY DRIFT / DERIVA DE ENTREPISO</text><path d="M298 482V120H590V482M298 300H590" stroke="#bac9cf" stroke-width="2" fill="none" stroke-dasharray="7 7"/><path d="M298 482L340 300L394 120M590 482L632 300L686 120M340 300H632M394 120H686" stroke="#245563" stroke-width="5" fill="none" /><path d="M284 486H312V499H284ZM576 486H604V499H576Z" fill="#a8b9bf"/><path d="M299 96H394M299 88V104M394 88V104" stroke="#5c747e" stroke-width="1.3" fill="none" /><text x="438" y="103" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#253d48" >uᵢ = 32 mm</text><path d="M340 301L258 264H128" stroke="#5c747e" stroke-width="1.3" fill="none" /><text x="128" y="247" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#253d48" >uᵢ₋₁ = 14 mm</text><path d="M741 120H781M741 300H781M767 120V300M759 120H775M759 300H775" stroke="#bac9cf" stroke-width="1.5" fill="none" /><text x="800" y="218" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#253d48" >hᵢ = 3.00 m</text><text x="696" y="411" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#245563" >Δu = 18 mm</text><text x="80" y="429" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#245563" >θ = 0.006</text><text x="80" y="469" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#5c747e" >θ = 0.60 %</text><text x="48" y="579" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5c747e" letter-spacing=".3">AMPLIFIED DISPLACEMENTS / DESPLAZAMIENTOS AMPLIFICADOS</text>
</svg>
