<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Pushover · bilinear conceptual example</title><desc id="desc">Original analytical graph of the educational bilinear relationship: yield 20 mm and 500 kN; assumed displacement 60 mm gives 580 kN. No performance-point computation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245563"/></marker></defs>
