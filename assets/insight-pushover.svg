<path d="M48 75H952M48 545H952" stroke="#c7d4d8" stroke-width="1" fill="none" />
<text x="48" y="46" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#245563" letter-spacing="2">BILINEAR / CONCEPTUAL</text><path d="M100 105V480H901" stroke="#5c747e" stroke-width="1.5" fill="none" /><path d="M100 480L292.5 208.57L870 143.43V480Z" stroke="none" stroke-width="0" fill="#dbe7e9" /><path d="M100 208.57H292.5M292.5 208.57V480M100 165.14H677.5M677.5 165.14V480" stroke="#bac9cf" stroke-width="1.3" fill="none" stroke-dasharray="5 7"/><path d="M100 480L677.5 165.14" stroke="#879fa8" stroke-width="2" fill="none" stroke-dasharray="7 7"/><path d="M100 480L292.5 208.57L870 143.43" stroke="#245563" stroke-width="4" fill="none" /><circle cx="292.5" cy="208.57" r="6" fill="#245563"/><circle cx="677.5" cy="165.14" r="7" fill="#eef2f2" stroke="#245563" stroke-width="3"/><text x="90" y="104" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#253d48" >Vb (kN)</text><text x="876" y="515" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#253d48" >δ (mm)</text><text x="75" y="487" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5c747e" >0</text><text x="292.5" y="515" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#5c747e" text-anchor="middle">20</text><text x="677.5" y="515" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#245563" text-anchor="middle">60*</text><text x="80" y="216" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5c747e" text-anchor="end">500</text><text x="713" y="135" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#245563" >580 kN</text><text x="153" y="145" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#253d48" >K₀ = 25 kN/mm</text><text x="398" y="340" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#5c747e" >Ksec ≈ 9.67 kN/mm</text><text x="48" y="579" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5c747e" letter-spacing=".6">* ASSUMED DISPLACEMENT / DESPLAZAMIENTO SUPUESTO</text>
