<title id="title">Retrofit · conceptual redistribution</title><desc id="desc">Two parallel lateral springs support a rigid collector. Changing stiffness from k and k to 3k and k redistributes a fixed 100 kN force from 50/50 to 75/25 kN. Educational example only.</desc>
